            '抚慰主食': '🍜 抚慰主食'
        };

        var porkCats = ['肉丝', '肉馅'];

        // ★★★ 核心轮转函数：每个分类独立指针，每次取下一道 ★★★
        function getRotateCandidate(catName) {
            var items = getItemsByCat(catName);
            if (!items || items.length === 0) return null;

            var history = getHistory();
            if (!history.pointers) history.pointers = {};
            if (history.pointers[catName] === undefined) history.pointers[catName] = 0;

            var pointer = history.pointers[catName];
            var item = items[pointer % items.length];
            history.pointers[catName] = (pointer + 1) % items.length;
            saveHistory(history);
            return item;
        }

        var mainContent = document.getElementById('mainContent');
        var allCards = [];
        var nameToCard = {};

        function renderAll() {
            mainContent.innerHTML = '';
            allCards = [];
            nameToCard = {};
            var weekMap = getDishWeekMap();

            if (!dishData || dishData.length === 0) {
                mainContent.innerHTML =
                    '<div style="padding:40px;text-align:center;color:#8896ab;">暂无菜品数据，请粘贴 dishData。</div>';
                return;
            }

            dishData.forEach(function(group) {
                if (!group || !group.items || group.items.length === 0) return;

                var groupDiv = document.createElement('div');
                groupDiv.className = 'dish-group';

                var header = document.createElement('div');
                header.className = 'group-header';
                header.innerHTML =
                    `<span class="arrow">▼</span><span class="group-title">${catNames[group.cat] || group.cat}</span><span class="dish-count">${group.items.length} 道</span>`;
                groupDiv.appendChild(header);

                var body = document.createElement('div');
                body.className = 'group-body';
                var grid = document.createElement('div');
                grid.className = 'dish-grid';

                group.items.forEach(function(item) {
                    try {
                        var name = item.n || '未命名';
                        var mains = item.m || [];
                        var mainsJson = JSON.stringify(mains);
                        var card = document.createElement('div');
                        card.className = 'dish-card';
                        card.setAttribute('data-id', name);
                        card.setAttribute('data-mains', mainsJson);

                        var head = document.createElement('div');
                        head.className = 'dish-head';
                        var weeks = weekMap[name] || [];
                        // 对周数排序（升序）
                        var sortedWeeks = weeks.slice().sort(function(a, b) { return a - b; });
                        var badgeHtml = '';
                        if (sortedWeeks.length > 0) {
                            var display = sortedWeeks.slice(0, 6).join(',');
                            if (sortedWeeks.length > 6) display += '...';
                            badgeHtml = `<span class="week-badge">📅 ${display}周</span>`;
                        } else {
                            badgeHtml = `<span class="week-badge" style="background:#f1f3f5;color:#aaa;">未出</span>`;
                        }
                        head.innerHTML =
                            `<input type="checkbox" class="dish-check"><span class="dish-name">${name} ${badgeHtml}</span>`;
                        card.appendChild(head);

                        var bodyContent = document.createElement('div');
                        bodyContent.className = 'dish-body';
                        var source = document.createElement('div');
                        source.className = 'source';
                        source.textContent = item.s || '参考家常菜谱';
                        bodyContent.appendChild(source);

                        var timeTag = document.createElement('div');
                        timeTag.className = 'time-tag';
                        timeTag.textContent = '⏱ ' + (item.t || '20分钟');

        // ================================================================
        // ★★★ 生成一周食单（固定4道 + 8周计划表轮换3道，全部使用轮转指针）★★★
        // ================================================================
        document.getElementById('generateWeekBtn').addEventListener('click', function() {
            var totalDishes = 0;
            dishData.forEach(function(g) { totalDishes += g.items.length; });
            if (totalDishes === 0) {
                alert('请先粘贴完整的菜品数据！');
                return;
            }

            var weekMap = getDishWeekMap();
            var history = getHistory();
            var weekNum = history.currentWeek || 0;
            var isOddWeek = (weekNum % 2 === 1);

            if (history.weekCounter === undefined) {
                history.weekCounter = 0;
            }
            var weekInCycle = history.weekCounter % 8;

            var selected = [];
            var selectedNames = [];

            function addToSelected(dish) {
                if (!dish) return false;
                if (selectedNames.indexOf(dish.n) !== -1) return false;
                selected.push(dish);
                selectedNames.push(dish.n);
                return true;
            }

            // 固定4道
            addToSelected(getRotateCandidate('鸡蛋'));
            addToSelected(getRotateCandidate('鱼类'));
            var porkCat = isOddWeek ? '肉丝' : '肉馅';
            addToSelected(getRotateCandidate(porkCat));
            addToSelected(getRotateCandidate('鸡肉'));

            // 轮换3道
            var schedule = [
                ['虾类', '豆制品', '凉菜'],
                ['虾类', '经典大菜', '牛羊肉卷'],
                ['豆制品', '虾类', '牛肉（鲜）'],
                ['豆制品', '凉菜', '经典大菜'],
                ['虾类', '豆制品', '牛羊肉卷'],
                ['虾类', '牛肉（鲜）', '凉菜'],
                ['豆制品', '虾类', '经典大菜'],
                ['豆制品', '牛羊肉卷', '牛肉（鲜）']
            ];

            var rotateCategories = schedule[weekInCycle];
            rotateCategories.forEach(function(cat) {
                var dish = getRotateCandidate(cat);
                if (dish) addToSelected(dish);
            });

            // 更新 weekCounter（重新获取最新历史，避免覆盖指针）
            var latestHistory = getHistory();
            latestHistory.weekCounter = (latestHistory.weekCounter + 1) % 8;
            saveHistory(latestHistory);

            // 补全（极少发生）
            var allItems = [];
            dishData.forEach(function(g) { allItems = allItems.concat(g.items); });
            while (selected.length < 7) {
                var remaining = allItems.filter(function(item) {
                    return selectedNames.indexOf(item.n) === -1;
                });
                if (remaining.length === 0) break;
                var sorted = remaining.slice().sort(function(a, b) {
                    var weeksA = weekMap[a.n] || [];
                    var weeksB = weekMap[b.n] || [];
                    var lastA = weeksA.length > 0 ? weeksA[weeksA.length - 1] : 0;
                    var lastB = weeksB.length > 0 ? weeksB[weeksB.length - 1] : 0;
                    return lastA - lastB;
                });
                var extra = sorted[0];
                if (extra) addToSelected(extra);
                else break;
            }

            var names = selected.map(function(item) { return item.n; });
            var newWeek = recordWeekDishes(names);

            document.querySelectorAll('.dish-check').forEach(function(cb) { cb.checked = false; });
            document.querySelectorAll('.qs-check').forEach(function(cb) { cb.checked = false; });
            selected.forEach(function(item) {
                var card = nameToCard[item.n];
                if (card) {
                    var cb = card.querySelector('.dish-check');
                    if (cb) cb.checked = true;
                }
                var qsCb = document.querySelector('.qs-check[data-name="' + item.n + '"]');
                if (qsCb) qsCb.checked = true;
            });
            updateSelectedCount();

            renderWeekMenu();
            renderAll();

            var usedAfter = getDishWeekMap();
            var usedCount = Object.keys(usedAfter).length;
            alert('✅ 已生成第 ' + newWeek + ' 周食单（7道）：\n\n' + names.join('、') +
                '\n\n📊 已累计出菜：' + usedCount + '/' + totalDishes + ' 道');
        });

    <title>本周食单 · 好好吃饭</title>
    <style>
        ${style}
        .week-menu-area { display: block !important; font-size: 14px; background: white; padding: 24px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
        body { max-width: 860px; margin: 20px auto; padding: 20px; background: #f0f2f5; }
        .recipe-card { margin-bottom: 16px; }
        .selected-dishes-summary { margin-bottom: 16px; }

    </style>
</head>
<body>
    <div class="week-menu-area">${content}</div>
</body>
</html>`;

                    alert('请先勾选菜品并生成食单。');
                    return;
                }
                renderWeekMenu();

                    alert('生成内容失败，请重试。');
                    return;
                }
            }

            inner.appendChild(contentClone);
            wrapper.appendChild(inner);

            styles.forEach(function(style) {
                var clone = style.cloneNode(true);

                .reuse-tips h4 { font-size: 15px; font-weight: 600; color: #b9770e; margin: 0 0 6px 0; }
                .reuse-tips .reuse-item { font-size: 14px; padding: 4px 0; border-bottom: 1px dashed #f0e4d0; }
                .reuse-tips .reuse-item:last-child { border-bottom: none; }
                .reuse-tips .reuse-item .reuse-name { font-weight: 600; color: #1f3a5f; }
                .reuse-tips .reuse-item .reuse-dishes { color: #5e6f8d; font-size: 13px; }
                .recipe-card { border: 1px solid #e9edf4; border-radius: 8px; padding: 14px 18px; margin-bottom: 12px; background: white; }
                .recipe-card h3 { font-size: 16px; font-weight: 600; margin: 0 0 4px 0; }
                .recipe-card .source { font-size: 12px; color: #7a8aa3; }

                .recipe-card h4 { font-size: 14px; font-weight: 600; margin: 10px 0 4px 0; }
                .recipe-card ul, .recipe-card ol { padding-left: 22px; }
                .recipe-card .key-point { margin-top: 10px; padding: 10px 14px; background: #fef9e7; border-radius: 8px; border-left: 4px solid #e67e22; font-size: 14px; }
                .recipe-card .key-point::before { content: "💡 "; }
                .week-menu-area .menu-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
                .week-menu-area .menu-header h2 { font-size: 20px; font-weight: 600; color: #0b1e33; }
            `;
            wrapper.appendChild(extraStyle);

            document.body.appendChild(wrapper);

            setTimeout(function() {
                html2canvas(wrapper, {
                    scale: 2,
                    backgroundColor: '#f0f2f5',
                    useCORS: true,
                    logging: false,
                    width: 860,
                    height: wrapper.scrollHeight
                }).then(function(canvas) {
                    var link = document.createElement('a');
                    link.download = '本周食单_' + new Date().toISOString().slice(0,10) + '.png';
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                    document.body.removeChild(wrapper);
                }).catch(function(err) {
                    alert('导出图片失败，请重试。');
                    document.body.removeChild(wrapper);
                    console.error(err);
                });
            }, 500);
        });

        // ================================================================
        // 不想做饭（不变）
        // ================================================================
        var comfortModal = document.getElementById('comfortModal');
        var comfortDishName = document.getElementById('comfortDishName');
        var comfortMessage = document.getElementById('comfortMessage');
        var comfortRecipe = document.getElementById('comfortRecipe');
        var comfortDishes = [];

        dishData.forEach(function(group) {
            if (group.cat === '抚慰主食') {
                group.items.forEach(function(item) {
                    if (!item.comfort) {
                        item.comfort = '累了就歇歇，好好吃饭比什么都重要。';
                    }
                    comfortDishes.push(item);
                });
            }
        });
        if (comfortDishes.length === 0) {
            comfortDishes = [
                { n: '皮蛋瘦肉粥', comfort: '累了吧？来碗热粥，暖胃又暖心。', z: ['大米 半杯', '皮蛋 1个', '猪里脊肉 50g'],
                    f: ['生姜 2片', '小葱 1根'], l: ['盐 1小勺', '白胡椒粉 少许', '香油 几滴'],
                    o: ['大米煮成粥', '加皮蛋和肉丝'], k: '粥底要煮到开花出米油' }
            ];
        }

        var currentComfort = null;

        function randomComfort() {
            var idx = Math.floor(Math.random() * comfortDishes.length);
            currentComfort = comfortDishes[idx];
            comfortDishName.textContent = '🍜 ' + currentComfort.n;
            comfortMessage.classList.remove('show');
            comfortMessage.textContent = '';
            var html = '';
            if (currentComfort.z && currentComfort.z.length) {
                html += '<h4>【主料】</h4><ul>';
                currentComfort.z.forEach(function(line) { html += '<li>' + line + '</li>'; });
                html += '</ul>';
            }
            if (currentComfort.f && currentComfort.f.length) {
                html += '<h4>【辅料】</h4><ul>';
                currentComfort.f.forEach(function(line) { html += '<li>' + line + '</li>'; });
                html += '</ul>';
            }
            if (currentComfort.l && currentComfort.l.length) {
                html += '<h4>【调料】</h4><ul>';
                currentComfort.l.forEach(function(line) { html += '<li>' + line + '</li>'; });
                html += '</ul>';
            }
            if (currentComfort.o && currentComfort.o.length) {
                html += '<h4>操作步骤</h4><ol>';
                currentComfort.o.forEach(function(line) { html += '<li>' + line + '</li>'; });
                html += '</ol>';
            }
            if (currentComfort.k) {
                html += '<div class="key-point">' + currentComfort.k + '</div>';
            }
            comfortRecipe.innerHTML = html;
            var confirmBtn = document.getElementById('comfortConfirm');
            confirmBtn.textContent = '就吃这个';
            confirmBtn.style.background = '';
        }

        document.getElementById('comfortBtn').addEventListener('click', function() {
            randomComfort();
            comfortModal.classList.add('active');
        });

        document.getElementById('comfortRefresh').addEventListener('click', function() {
            randomComfort();
        });

        document.getElementById('comfortConfirm').addEventListener('click', function() {
            if (currentComfort && currentComfort.comfort) {
                comfortMessage.innerHTML = '<span class="emoji">😊</span> ' + currentComfort.comfort;
                comfortMessage.classList.add('show');
            }
            var btn = document.getElementById('comfortConfirm');
            btn.textContent = '✅ 已选';
            btn.style.background = '#27ae60';
        });

        document.getElementById('comfortClose').addEventListener('click', function() {
            comfortModal.classList.remove('active');
            comfortMessage.classList.remove('show');
        });
        comfortModal.addEventListener('click', function(e) {
            if (e.target === this) {
                comfortModal.classList.remove('active');
                comfortMessage.classList.remove('show');
            }
        });

        function getComfortHTML() {
            if (!currentComfort) return null;
            var style = document.querySelector('style').innerHTML;
            var html = `
                <div style="max-width:600px;margin:20px auto;padding:20px;background:white;border-radius:20px;box-shadow:0 24px 48px rgba(0,0,0,0.2);">
                    <h2 style="text-align:center;font-size:22px;font-weight:600;margin-bottom:8px;">🍜 ${currentComfort.n}</h2>
                    <p style="text-align:center;color:#5e6f8d;font-style:italic;font-size:16px;padding:10px 0;border-bottom:1px dashed #e9edf4;margin-bottom:16px;">${currentComfort.comfort || '累了就歇歇，好好吃饭。'}</p>
                    <div style="font-size:14px;line-height:1.6;">
                        ${currentComfort.z && currentComfort.z.length ? '<h4 style="font-weight:600;margin:10px 0 4px;">【主料】</h4><ul style="padding-left:22px;">' + currentComfort.z.map(line => '<li>'+line+'</li>').join('') + '</ul>' : ''}
                        ${currentComfort.f && currentComfort.f.length ? '<h4 style="font-weight:600;margin:10px 0 4px;">【辅料】</h4><ul style="padding-left:22px;">' + currentComfort.f.map(line => '<li>'+line+'</li>').join('') + '</ul>' : ''}
                        ${currentComfort.l && currentComfort.l.length ? '<h4 style="font-weight:600;margin:10px 0 4px;">【调料】</h4><ul style="padding-left:22px;">' + currentComfort.l.map(line => '<li>'+line+'</li>').join('') + '</ul>' : ''}
                        ${currentComfort.o && currentComfort.o.length ? '<h4 style="font-weight:600;margin:10px 0 4px;">操作步骤</h4><ol style="padding-left:22px;">' + currentComfort.o.map(line => '<li>'+line+'</li>').join('') + '</ol>' : ''}
                        ${currentComfort.k ? '<div style="margin-top:10px;padding:10px 14px;background:#fef9e7;border-radius:8px;border-left:4px solid #e67e22;font-size:14px;">💡 ' + currentComfort.k + '</div>' : ''}
                    </div>
                </div>
            `;
            return `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>不想做饭 · 好好吃饭</title><style>${style} body{background:#f0f2f5;margin:0;padding:20px;}</style></head><body>${html}</body></html>`;
        }

        document.getElementById('comfortExportHtml').addEventListener('click', function() {
            var fullHtml = getComfortHTML();
            if (!fullHtml) { alert('请先选一道抚慰主食。'); return; }
            var blob = new Blob([fullHtml], { type: 'text/html' });
            var a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `不想做饭_${currentComfort.n}_${new Date().toISOString().slice(0,10)}.html`;
            a.click();
        });

        document.getElementById('comfortExportPng').addEventListener('click', function() {
            if (!currentComfort) { alert('请先选一道抚慰主食。'); return; }
            var wrapper = document.createElement('div');
            wrapper.style.cssText = 'padding:24px;background:#f0f2f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;';
            var inner = document.createElement('div');
            inner.style.cssText = 'max-width:600px;width:100%;padding:24px;background:white;border-radius:20px;box-shadow:0 24px 48px rgba(0,0,0,0.2);';
            var html = `
                <h2 style="text-align:center;font-size:22px;font-weight:600;margin-bottom:8px;">🍜 ${currentComfort.n}</h2>

                <div style="font-size:14px;line-height:1.6;">
                    ${currentComfort.z && currentComfort.z.length ? '<h4 style="font-weight:600;margin:10px 0 4px;">【主料】</h4><ul style="padding-left:22px;">' + currentComfort.z.map(line => '<li>'+line+'</li>').join('') + '</ul>' : ''}
                    ${currentComfort.f && currentComfort.f.length ? '<h4 style="font-weight:600;margin:10px 0 4px;">【辅料】</h4><ul style="padding-left:22px;">' + currentComfort.f.map(line => '<li>'+line+'</li>').join('') + '</ul>' : ''}
                    ${currentComfort.l && currentComfort.l.length ? '<h4 style="font-weight:600;margin:10px 0 4px;">【调料】</h4><ul style="padding-left:22px;">' + currentComfort.l.map(line => '<li>'+line+'</li>').join('') + '</ul>' : ''}
                    ${currentComfort.o && currentComfort.o.length ? '<h4 style="font-weight:600;margin:10px 0 4px;">操作步骤</h4><ol style="padding-left:22px;">' + currentComfort.o.map(line => '<li>'+line+'</li>').join('') + '</ol>' : ''}
                    ${currentComfort.k ? '<div style="margin-top:10px;padding:10px 14px;background:#fef9e7;border-radius:8px;border-left:4px solid #e67e22;font-size:14px;">💡 ' + currentComfort.k + '</div>' : ''}
                </div>
            `;
            inner.innerHTML = html;
            wrapper.appendChild(inner);
            document.body.appendChild(wrapper);
            html2canvas(wrapper, { scale: 2, backgroundColor: '#f0f2f5', useCORS: true }).then(function(canvas) {
                var link = document.createElement('a');
                link.download = `不想做饭_${currentComfort.n}_${new Date().toISOString().slice(0,10)}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                document.body.removeChild(wrapper);
            }).catch(function(err) {
                alert('导出图片失败，请重试。');
                document.body.removeChild(wrapper);
                console.error(err);
            });
        });

        document.getElementById('resetHistoryBtn').addEventListener('click', resetHistory);
        renderAll();

        // ====== 注册 Service Worker（内联，无需外部文件） ======
        if ('serviceWorker' in navigator) {
            const swCode = `
                self.addEventListener('install', e => {
                    e.waitUntil(self.skipWaiting());
                });
                self.addEventListener('activate', e => {
                    e.waitUntil(self.clients.claim());
                });
                self.addEventListener('fetch', e => {
                    e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
                });
            `;
            const blob = new Blob([swCode], { type: 'application/javascript' });
            const swUrl = URL.createObjectURL(blob);
            navigator.serviceWorker.register(swUrl).then(() => {
                console.log('Service Worker 注册成功');
            }).catch(err => {
                console.log('Service Worker 注册失败:', err);
            });
        }
    </script>
